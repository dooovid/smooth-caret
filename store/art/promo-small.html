<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Small promo tile</title>
<link rel="stylesheet" href="art.css">
<style>
  .promo { width: 440px; height: 280px; }
  /* The logo's four bars, huge and faint, gliding off to the right. */
  .bars { position: absolute; right: -40px; top: -30px; height: 340px; opacity: .16; }
  .mark { position: absolute; left: 50%; top: 50%; display: flex; align-items: center; gap: 18px; transform: translate(-50%, -50%); }
  .mark img { width: 84px; height: 84px; border-radius: 11px; box-shadow: 0 14px 34px rgba(36, 16, 120, .45); }
  .mark b { color: #fff; font-size: 40px; font-weight: 740; letter-spacing: -.03em; line-height: 1; white-space: nowrap; }
</style>
</head>
<body>
<div class="promo">
  <svg class="bars" viewBox="28 24 72 80" aria-hidden="true">
    <g fill="#fff">
      <polygon points="42,24 51.5,24 38.1,103.5 28.6,103.5" fill-opacity=".25"/>
      <polygon points="58,24 67.5,24 54.1,103.5 44.6,103.5" fill-opacity=".5"/>
      <polygon points="74,24 83.5,24 70.1,103.5 60.6,103.5" fill-opacity=".8"/>
      <polygon points="90,24 99.5,24 86.1,103.5 76.6,103.5"/>
    </g>
  </svg>
  <div class="mark"><img src="logo.svg" alt=""><b>Smooth<br>Caret</b></div>
</div>
</body>
</html>
